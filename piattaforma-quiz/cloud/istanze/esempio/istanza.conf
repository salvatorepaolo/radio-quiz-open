# Istanza di Quiz Radiologia per un'azienda: copia questa cartella in istanze/<nome> (lettere minuscole, numeri, trattini),
# compila i valori e pubblica con «pubblica-azienda.command» (oppure: ISTANZA=<nome> bash pubblica.command).
# Ogni valore fra virgolette. I codici e i segreti li genera la pubblicazione in istanze/<nome>/.segreti.

# nome dell'azienda come compare nel sito e nelle email
NOME_ISTANZA="Azienda Ospedaliera di esempio"
# indirizzo del sito e zona DNS (su Route 53 dello stesso conto AWS)
DOMINIO="esempio.radio-quiz.it"
ZONA="radio-quiz.it"
# referente dell'azienda: le risposte alle email arrivano qui; compare nella pagina di accesso
CONTATTO="formazione@azienda.example"
# 1 = sottodominio di radio-quiz.it: usa la posta già configurata per la vetrina (mittente avvisi@radio-quiz.it)
# 0 = dominio proprio dell'azienda: la pubblicazione configura anche l'invio delle email per quel dominio
EMAIL_CONDIVISA="1"
