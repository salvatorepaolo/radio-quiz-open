# Licenze dei file del repository, nel formato REUSE (https://reuse.software): chi riusa un singolo file sa con quale
# licenza può farlo. I testi completi sono nella cartella LICENSES/. Controllo: reuse lint (vedi piattaforma-quiz/qualita).
# Fra le regole che valgono per lo stesso file vince l'ultima.
version = 1
SPDX-PackageName = "Quiz Radiologia (radio-quiz.it)"
SPDX-PackageSupplier = "Salvatore Paolo Buemi <info@radio-quiz.it>"
SPDX-PackageDownloadLocation = "https://github.com/salvatorepaolo/radio-quiz-open"

# codice, configurazioni, test e strumenti
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Salvatore Paolo Buemi <info@radio-quiz.it>"
SPDX-License-Identifier = "EUPL-1.2"

# contenuti didattici: casi, traduzioni, percorsi, schede, protocolli, modelli di referto, aiuto, manuali
[[annotations]]
path = [
  "piattaforma-quiz/casi-free/**", "piattaforma-quiz/i18n/**", "piattaforma-quiz/cloud/web/lingua/casi/**",
  "piattaforma-quiz/cloud/web/aiuto.json", "piattaforma-quiz/cloud/web/percorsi.json", "piattaforma-quiz/cloud/web/schede.json",
  "piattaforma-quiz/cloud/web/protocolli.json", "piattaforma-quiz/cloud/web/modelli-referto.json",
  "piattaforma-quiz/cloud/web/lingua/en/**", "piattaforma-quiz/cloud/web/manuale-client.html",
  "piattaforma-quiz/cloud/web/manuale-client.en.html", "piattaforma-quiz/cloud/web/manuale.pdf",
  "piattaforma-quiz/cloud/web/argomenti/**", "piattaforma-quiz/cloud/web/en/**",
]
SPDX-FileCopyrightText = "2026 Salvatore Paolo Buemi <info@radio-quiz.it>"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# immagini della home: ricavate da collezioni di The Cancer Imaging Archive (citazioni in licenze.html)
[[annotations]]
path = ["docs/*.jpg", "piattaforma-quiz/cloud/web/img/eroe/**", "piattaforma-quiz/cloud/web/img/galleria/**", "piattaforma-quiz/cloud/web/img/anteprima-caso*", "piattaforma-quiz/cloud/web/img/condivisione.jpg"]
SPDX-FileCopyrightText = "The Cancer Imaging Archive, collezioni citate in piattaforma-quiz/cloud/web/licenze.html"
SPDX-License-Identifier = "CC-BY-4.0"

